[package]
name = "local_llm"
version = "0.1.0"
edition = "2021"
description = "Qwen3-0.6B chat service for Awkernel (model loaded from the ramdisk)"

[dependencies]
log = "0.4"

[dependencies.awkernel_llm]
path = "../../awkernel_llm"

[dependencies.awkernel_async_lib]
path = "../../awkernel_async_lib"
default-features = false

[dependencies.awkernel_lib]
path = "../../awkernel_lib"
default-features = false

[features]
default = []
# Run a reference prompt at boot and compare the tokens with llm.asm.
selftest = []
